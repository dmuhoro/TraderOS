name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert single version source (pyproject.toml) matches config
        run: |
          pkg=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cfg=$(grep -oP '^version:\s+"\K[^"]+' configs/settings.yaml)
          echo "pyproject.toml=$pkg settings.yaml=$cfg"
          test "$pkg" = "$cfg" || { echo "version drift: pyproject.toml=$pkg settings.yaml=$cfg"; exit 1; }
          test -z "$(git ls-files VERSION)" || { echo "VERSION file is legacy; pyproject.toml is the single version source"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install ruff==0.16.0
      - run: ruff check src/traderos/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install pyright==1.1.411
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - run: pyright src/traderos/

  test:
    runs-on: ubuntu-latest
    # Postgres is intentionally provisioned here (declared, not assumed): the
    # port-5433 service below matches tests' default POSTGRES_TEST_DSN
    # (localhost:5433), so the Postgres-backed tests RUN for real in CI. The
    # reachability guard in those test modules only SKIPS when a Postgres is
    # genuinely unreachable (e.g. local dev without a container), so this CI
    # job exercises the "pass" path, not the "skip" path.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traderos_test
          POSTGRES_USER: traderos
          POSTGRES_PASSWORD: traderos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U traderos -d traderos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - run: pip install pytest pytest-cov
      - run: make test-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  # G-06: the credential-free evidence-drill suite runs as its own job on every
  # push/PR. Each drill proves a fail-closed rail against the REAL wiring
  # (real CycleExecutor/RiskService/BrokerAdapter, real HTTP transports, real
  # governance gate) and exits 0 only on a full PASS; the runner exits non-zero
  # if ANY drill fails, so a regression that silently weakens a rail stops the
  # build. Credential/network/instance-gated drills are documented exclusions
  # from this deterministic job — see KEY_GATED in the runner (credential-gated
  # ones are operator-run; the network-gated real-market walk-forward stays
  # exercised by the normal test suite when the feed is reachable).
  evidence-drills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - name: Run the credential-free evidence-drill suite
        run: python3 scripts/evidence/run_ci_drills.py
      - name: Upload the aggregated evidence log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-drills
          path: docs/evidence/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install pip-audit bandit
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - name: Check dependency vulnerabilities
        # --skip-editable: the local `traderos` package is not on PyPI, so
        # pip-audit cannot audit it; the audited surface is every real
        # third-party dependency.
        run: pip-audit --skip-editable
      - name: Check for hardcoded secrets and security issues
        run: bandit -r src/traderos/ -lll

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-check:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traderos
          POSTGRES_USER: traderos
          POSTGRES_PASSWORD: traderos
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U traderos -d traderos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose stack
        run: docker compose config -q
      - name: Build image
        run: docker build -t traderos:ci .
      - name: Verify migrations on fresh PostgreSQL
        env:
          DATABASE_URL: postgresql://traderos:traderos@localhost:5434/traderos
        run: |
          docker run --rm --network host --entrypoint traderos \
            -e DATABASE_URL="$DATABASE_URL" \
            traderos:ci db migrate
          docker run --rm --network host --entrypoint traderos \
            -e DATABASE_URL="$DATABASE_URL" \
            traderos:ci db check | grep "Schema version: 6"
      - name: Verify API container health
        run: |
          docker run --rm -d --network host --name traderos-api-smoke \
            -e DATABASE_URL="postgresql://traderos:traderos@localhost:5434/traderos" \
            traderos:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/healthz || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          test "$code" = "200"
          curl -sf http://localhost:8000/v1/healthz
          docker rm -f traderos-api-smoke

  # G-07: the governance gate runs on every push/PR. In paper mode it is a
  # pass-through (fail-closed only when a live posture is declared); a live
  # posture on any branch is blocked unless every documented GO condition —
  # including a valid operator acknowledgment of the red-lines — holds.
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - name: Run the live gate (paper mode passes; live posture would be blocked)
        env:
          TRADING_MODE: paper
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python3 scripts/governance/live_gate.py
      - name: Fail closed if a live posture is declared without GO conditions
        env:
          TRADING_MODE: live
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set +e
          python3 scripts/governance/live_gate.py
          rc=$?
          set -e
          test "$rc" -ne 0 || { echo "LIVE GATE: unexpectedly passed with no GO declaration"; exit 1; }
          echo "LIVE GATE: correctly blocked a live posture with no GO conditions"
