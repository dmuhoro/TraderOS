name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert single version source (pyproject.toml) matches config
        run: |
          pkg=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cfg=$(grep -oP '^version:\s+"\K[^"]+' configs/settings.yaml)
          echo "pyproject.toml=$pkg settings.yaml=$cfg"
          test "$pkg" = "$cfg" || { echo "version drift: pyproject.toml=$pkg settings.yaml=$cfg"; exit 1; }
          test -z "$(git ls-files VERSION)" || { echo "VERSION file is legacy; pyproject.toml is the single version source"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install ruff==0.16.0
      - run: ruff check src/traderos/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install pyright==1.1.411
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - run: pyright src/traderos/

  test:
    runs-on: ubuntu-latest
    # Postgres is intentionally provisioned here (declared, not assumed): the
    # port-5433 service below matches tests' default POSTGRES_TEST_DSN
    # (localhost:5433), so the Postgres-backed tests RUN for real in CI. The
    # reachability guard in those test modules only SKIPS when a Postgres is
    # genuinely unreachable (e.g. local dev without a container), so this CI
    # job exercises the "pass" path, not the "skip" path.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traderos_test
          POSTGRES_USER: traderos
          POSTGRES_PASSWORD: traderos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U traderos -d traderos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - run: pip install pytest pytest-cov
      - run: make test-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install pip-audit bandit
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - name: Check dependency vulnerabilities
        run: pip-audit
      - name: Check for hardcoded secrets and security issues
        run: bandit -r src/traderos/ -lll

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-check:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traderos
          POSTGRES_USER: traderos
          POSTGRES_PASSWORD: traderos
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U traderos -d traderos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose stack
        run: docker compose config -q
      - name: Build image
        run: docker build -t traderos:ci .
      - name: Verify migrations on fresh PostgreSQL
        env:
          DATABASE_URL: postgresql://traderos:traderos@localhost:5434/traderos
        run: |
          docker run --rm --network host --entrypoint traderos \
            -e DATABASE_URL="$DATABASE_URL" \
            traderos:ci db migrate
          docker run --rm --network host --entrypoint traderos \
            -e DATABASE_URL="$DATABASE_URL" \
            traderos:ci db check | grep "Schema version: 6"
      - name: Verify API container health
        run: |
          docker run --rm -d --network host --name traderos-api-smoke \
            -e DATABASE_URL="postgresql://traderos:traderos@localhost:5434/traderos" \
            traderos:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/healthz || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          test "$code" = "200"
          curl -sf http://localhost:8000/v1/healthz
          docker rm -f traderos-api-smoke
