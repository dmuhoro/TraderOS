name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches pyproject.toml version
        run: |
          pkg=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME pyproject.toml=$pkg"
          test "$pkg" = "$tag" || { echo "version mismatch: tag=$tag pyproject.toml=$pkg"; exit 1; }

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traderos_test
          POSTGRES_USER: traderos
          POSTGRES_PASSWORD: traderos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U traderos -d traderos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install -e ".[api,alpaca,postgres,monitoring]"
      - run: pip install pytest pytest-cov
      - run: make test-coverage

  publish:
    runs-on: ubuntu-latest
    needs: [version-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel
        run: |
          pip install build
          python -m build
          ls -la dist/
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Release $GITHUB_REF_NAME"
          if [ -f CHANGELOG.md ]; then
            section=$(awk "/^## \[${GITHUB_REF_NAME}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md)
            [ -n "$section" ] || section=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md)
            [ -n "$section" ] && notes="$section" || true
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --notes "$notes" --title "TraderOS $GITHUB_REF_NAME"
