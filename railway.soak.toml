# Config-as-code for the dedicated `traderos-soak` Railway service (Sprint 44).
# This file is bound to the soak service via its `railwayConfigFile` instance
# setting, so it never collides with the production `railway.toml`.
#
# Runs the G-02 unattended real Alpaca paper-broker soak: bounded batches of
# the verified real-path harness (CycleExecutor -> JournaledBroker ->
# AlpacaBrokerAdapter -> real paper endpoint) with clean reconcile required
# per batch. Evidence is written to the mounted volume AND printed to stdout
# (visible via `railway logs --service traderos-soak`).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python3 scripts/evidence/run_unattended_paper_soak.py --hours 72 --batch-cycles 10 --interval-minutes 60"
# The soak is self-supervised and checkpointed: a restart CONTINUES the 72h
# window from `docs/evidence/unattended_paper_soak_soak_state.json` instead of
# resetting it. `maxRetries = 3` therefore guaranteed failure — Railway gave up
# after 4 process starts, each discarding the elapsed window, and the service
# went CRASHED with no verdict. Measured: pre-fix, a restart burned a second
# full window (40.2s consumed of a 30s window); post-fix, 30.4s.
#
# Retries are bounded (fail-closed against a tight crash loop / bad credentials,
# which would otherwise spin forever) but sized for a 72h unattended run.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 50

[[deploy.volumes]]
mountPath = "/app/docs/evidence"
