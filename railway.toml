[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/v1/healthz"
healthcheckTimeout = 120
startCommand = "traderos-api"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/app/data"

[[deploy.volumes]]
mountPath = "/app/exports"
