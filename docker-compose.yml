services:
  traderos:
    build: .
    container_name: traderos
    volumes:
      - traderos_data:/app/data
      - traderos_exports:/app/exports
    environment:
      - DB_PATH=/app/data/traderos.db
      - LOG_LEVEL=INFO
    restart: unless-stopped

volumes:
  traderos_data:
  traderos_exports:
