name: traderos

services:
  # Production database. The API and the daemon share this single source of
  # truth, which is what makes multi-container operation safe (ADR-005).
  postgres:
    image: postgres:16-alpine
    container_name: traderos-postgres
    environment:
      POSTGRES_USER: traderos
      POSTGRES_PASSWORD: traderos
      POSTGRES_DB: traderos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderos -d traderos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # REST + operator dashboard surface. Migrations run on first orchestrator
  # build (application/factory.build_orchestrator), so the schema is created
  # against Postgres on boot.
  traderos-api:
    build: .
    container_name: traderos-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://traderos:traderos@postgres:5432/traderos
      LOG_LEVEL: INFO
      TRADEROS_API_KEY: ${TRADEROS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The trading loop. Runs the same image with the daemon entrypoint so the
  # paper trading cycles actually execute (previously compose ran two APIs and
  # no daemon, so the loop never ran).
  traderos-daemon:
    build: .
    container_name: traderos-daemon
    entrypoint: traderos
    command: daemon --interval 60 --mode paper
    environment:
      DATABASE_URL: postgresql://traderos:traderos@postgres:5432/traderos
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traderos", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Local test database (make test-postgres). Not part of the default stack.
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: traderos-pg-test
    environment:
      POSTGRES_USER: traderos
      POSTGRES_PASSWORD: traderos
      POSTGRES_DB: traderos_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderos -d traderos_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  traderos_data:
  traderos_exports:
